[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Lets the frontend call a clean path (POST /api/claim-review) instead of
# the raw /.netlify/functions/... URL.
[[redirects]]
  from = "/api/claim-review"
  to = "/.netlify/functions/claim-review"
  status = 200
  force = true

# Starts a Shopify checkout from the site cart (POST /api/checkout). Switched off
# until CHECKOUT_ENABLED=true is set in Netlify.
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200
  force = true

# Checks a promo code from the cart (POST /api/promo).
[[redirects]]
  from = "/api/promo"
  to = "/.netlify/functions/promo"
  status = 200
  force = true

# Pre-order count shown on the product pages (GET /api/preorder-count).
[[redirects]]
  from = "/api/preorder-count"
  to = "/.netlify/functions/preorder-count"
  status = 200
  force = true

# The Full Stack page used to live at /classic-stack. Keep old links and search results working.
[[redirects]]
  from = "/classic-stack.html"
  to = "/full-stack.html"
  status = 301
  force = true

[[redirects]]
  from = "/classic-stack"
  to = "/full-stack.html"
  status = 301
  force = true
