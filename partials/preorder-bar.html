  <!-- PRE-ORDER BAR: status strip above the header on every product page. Numbers come from src/preorder.js -->
  <div class="preorder-bar" role="region" aria-label="Pre-order status">
    <span class="preorder-bar-open">Pre-orders now open</span>
    <span class="preorder-bar-progress">
      <span class="preorder-bar-track"><span class="preorder-bar-fill" data-preorder-fill></span></span>
      <span class="preorder-bar-count"><span data-preorder-claimed>0</span> / <span data-preorder-goal>1,000</span> claimed</span>
    </span>
    <span class="preorder-bar-perks">Free scooper + lid + shipping</span>
  </div>
