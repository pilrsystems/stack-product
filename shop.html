<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Shop — Pilr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="nav-overlay" id="nav-overlay"></div>

  <nav class="nav">
    <a href="/" class="nav-logo">
      <img src="images/logov3-cropped.png" alt="pilr" class="nav-logo-img">
    </a>
    <div class="nav-right">
      <ul class="nav-links" id="nav-links">
        <li>
          <a href="./shop.html">
            Shop All
            <svg class="nav-chevron" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 5 5-5"/></svg>
          </a>
        </li>
        <li><a href="./why-pilr.html">Why pilr</a></li>
        <li><a href="./about.html">About</a></li>
        <li><a href="./faq.html">FAQ</a></li>
      </ul>
      <a href="./cart.html" class="nav-cart-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      </a>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="stub-page">
    <p class="stub-eyebrow">Shop All</p>
    <h1>Coming soon</h1>
    <p>This page is under construction.</p>
    <a href="/" class="btn btn--dark">← Back to Home</a>
  </div>

  <script>
    const hamburger = document.getElementById('nav-hamburger')
    const navLinks  = document.getElementById('nav-links')
    const overlay   = document.getElementById('nav-overlay')
    function openMenu()  { hamburger.classList.add('open'); navLinks.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow = 'hidden' }
    function closeMenu() { hamburger.classList.remove('open'); navLinks.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '' }
    hamburger.addEventListener('click', () => navLinks.classList.contains('open') ? closeMenu() : openMenu())
    overlay.addEventListener('click', closeMenu)
    navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu))
  </script>
</body>
</html>
