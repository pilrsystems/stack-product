  <script>
    const shopAllLi    = document.querySelector('.nav-has-dropdown')
    const shopDropdown = document.querySelector('.nav-dropdown')
    const dimOverlay   = document.getElementById('nav-dim-overlay')
    let dropOpen = false, dropCloseTimer = null
    function openDrop()  { clearTimeout(dropCloseTimer); dropCloseTimer = null; shopAllLi.classList.add('dropdown-active'); dimOverlay.classList.add('active'); dropOpen = true }
    function closeDrop() { clearTimeout(dropCloseTimer); dropCloseTimer = null; shopAllLi.classList.remove('dropdown-active'); dimOverlay.classList.remove('active'); dropOpen = false }
    dimOverlay.addEventListener('click', closeDrop)
    function inZone(x, y) {
      const li = shopAllLi.getBoundingClientRect(), dd = shopDropdown.getBoundingClientRect()
      if (x >= li.left && x <= li.right && y >= li.top && y <= li.bottom) return true
      if (y >= dd.top && y <= dd.bottom) return true
      if (y > li.bottom && y < dd.top) return true
      return false
    }
    shopAllLi.addEventListener('mouseenter', openDrop)
    document.addEventListener('mousemove', e => {
      if (!dropOpen) return
      if (inZone(e.clientX, e.clientY)) { clearTimeout(dropCloseTimer); dropCloseTimer = null }
      else if (!dropCloseTimer) { dropCloseTimer = setTimeout(closeDrop, 150) }
    })
    const hamburger = document.getElementById('nav-hamburger')
    const navLinks  = document.getElementById('nav-links')
    function closeMenu() { hamburger.classList.remove('open'); navLinks.classList.remove('open'); document.body.style.overflow = '' }
    hamburger.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open')
      hamburger.classList.toggle('open', open)
      document.body.style.overflow = open ? 'hidden' : ''
    })
    navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu))
  </script>
