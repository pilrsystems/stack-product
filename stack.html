<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reorder — PILR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #FAFAF8;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #5e6e7a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 560px;
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2rem;
    }

    .logo img {
      height: 30px;
      width: auto;
      display: block;
    }

    .divider {
      width: 36px;
      height: 1px;
      background: #5e6e7a;
      opacity: 0.25;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      color: #5e6e7a;
    }

    p {
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.7;
      color: #5e6e7a;
      opacity: 0.7;
    }

    .offer-placeholder {
      width: 100%;
      border: 1.5px dashed rgba(94, 110, 122, 0.3);
      border-radius: 10px;
      padding: 3rem 2rem;
      color: #5e6e7a;
      opacity: 0.45;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo">
      <img src="images/logov3-cropped.png" alt="Pilr" />
    </div>
    <div class="divider"></div>
    <h1>Welcome back.</h1>
    <p>Your exclusive offer is below.</p>
    <div class="offer-placeholder">Offer coming soon</div>
  </div>
</body>
</html>
